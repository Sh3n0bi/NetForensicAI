[project]
name = "netforensicai"
version = "0.1.0"
description = "Local-first DFIR investigation and evidence correlation platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Sh3n0bi" }]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
    "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
pcap = [
    "scapy>=2.5,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]
intel = [
    "requests>=2.31,<3.0",
]
ai = [
    "anthropic>=1.0,<2.0",
]
evtx = [
    "python-evtx>=0.8,<0.9",
]
dashboard = [
    "dash>=2.17,<3.0",
    "plotly>=5.15,<6.0",
]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
netforensic = "netforensicai.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netforensicai*"]
