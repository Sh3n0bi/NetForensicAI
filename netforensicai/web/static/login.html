<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>NetForensicAI - sign in</title>
  <style>
    /* Self-contained on purpose: this page is served before sign-in, so it
       does not pull in the application stylesheet or any external font. */
    :root { --bg: #0b0e14; --surface: #141824; --border: #262c3d; --text: #eceef4;
            --dim: #9aa1b6; --accent: #5b9dff; --bad: #f0616a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--bg); color: var(--text);
           font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 14px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 20px; color: var(--dim); }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--dim); }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { width: 100%; margin-top: 14px; padding: 10px 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: #07101f; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    #message { min-height: 1.5em; margin-top: 12px; font-size: 14px; color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>NetForensicAI</h1>
    <p>This server needs its access token.</p>
    <form id="login" autocomplete="on">
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <noscript><p>JavaScript is required to sign in.</p></noscript>
  </main>
  <script src="login.js"></script>
</body>
</html>
