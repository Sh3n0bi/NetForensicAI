<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetForensicAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">

    <!-- Left rail. Grouped by the stage of an investigation rather than
         listed flat: fourteen equal destinations say nothing about what
         belongs together, and a vertical rail has the room to say it -
         which a horizontal bar did not, having pushed its last tab off
         the right edge at 1440px. -->
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5b9dff" stroke-width="1.6" stroke-linejoin="round">
          <path d="M12 2l8 3.5v6c0 4.6-3.2 8.5-8 10.5-4.8-2-8-5.9-8-10.5v-6z"/>
          <path d="M9 12l2 2 4-4" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">NetForensic<em>AI</em></span>
          <span class="brand-sub">Local-first DFIR platform</span>
        </span>
      </a>

      <nav id="case-nav" class="rail" hidden></nav>

      <div class="rail-foot">
        <div id="capture-card"></div>
        <div class="local-mode">
          <span class="dot ok"></span>
          <div>
            <div>Local mode</div>
            <div class="muted">No data leaves your machine</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div id="case-switch" class="case-switch"></div>
        <a class="settings-link" href="#/settings">Settings</a>
      </header>

      <main id="app"></main>

      <footer class="statusbar" id="statusbar"></footer>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
