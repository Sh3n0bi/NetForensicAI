name: Publish to PyPI

# Runs when a GitHub Release is published (Releases -> Draft a new release
# -> pick/create a tag like v0.1.0 -> Publish). Does NOT run on every push,
# and never touches PyPI on its own - only a maintainer creating a release
# triggers a publish.
#
# workflow_dispatch lets a maintainer publish the version currently in
# pyproject.toml on demand from the Actions tab (Run workflow), without
# cutting a new release - used to publish a version whose release event
# already fired before the workflow was fixed.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # API-token auth: the token lives in the repo secret PYPI_API_TOKEN
        # (Settings -> Secrets and variables -> Actions). Trusted Publishing
        # (OIDC) is the longer-term goal - once a publisher is registered on
        # PyPI, drop `with:` here and restore `permissions: id-token: write`.
        uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc # v1.12.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # This action generates PEP 740 attestations by default, which
          # need OIDC (`id-token: write`). With token auth and no such
          # permission, that step fails before upload - so turn it off.
          # Re-enable it (and the id-token permission) if we move to OIDC.
          attestations: false
          # Idempotent: a version already on PyPI is skipped rather than
          # failing the whole run. Lets a re-run or a manual dispatch of an
          # already-published version succeed, and makes releases safe to retry.
          skip-existing: true
