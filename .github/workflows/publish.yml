name: Publish to PyPI

# Runs when a GitHub Release is published (Releases -> Draft a new release
# -> pick/create a tag like v0.1.0 -> Publish). Does NOT run on every push,
# and never touches PyPI on its own - only a maintainer creating a release
# triggers a publish.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing (OIDC) - PyPI verifies this run came from this
      # exact repo/workflow, so no long-lived API token needs to live in
      # GitHub secrets at all. Must be configured once on the PyPI project
      # page first (see CONTRIBUTING.md's Releasing section) - this
      # workflow cannot set that up itself.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc # v1.12.2
