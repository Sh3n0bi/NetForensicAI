name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml's requires-python;
        # 3.12 is what this project has actually been developed/tested
        # against day to day. The `ai` extra (anthropic>=1.0) requires
        # Python >=3.10 itself - that's the SDK's own constraint, not
        # something to work around - so it (and the other AI provider
        # extras, ai-openai/ai-gemini) are only installed on 3.12 here.
        # Tests that need any of them skip cleanly on 3.9 via
        # pytest.importorskip.
        include:
          - python-version: "3.9"
            extras: "dev,pcap,intel,evtx,web"
          - python-version: "3.12"
            extras: "dev,pcap,intel,evtx,ai,ai-openai,ai-gemini,web"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test-relevant extras
        # dashboard (dash/plotly) is deliberately omitted: nothing in the
        # test suite imports netforensicai.dashboard, so installing it
        # here would just be extra time spent on an untested code path.
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: pytest -q

  wireshark:
    # The Wireshark integration is optional and its tests skip when tshark
    # is absent - which means the matrix job above, on a runner with no
    # Wireshark, reports green while never executing a single line of the
    # tshark engine, the display-filter code, or the dumpcap backend. This
    # job exists so that "the tests passed" actually covers them.
    #
    # It mirrors the matrix job rather than replacing it: that one proves
    # the pure-Python fallback still works with Wireshark absent, this one
    # proves the Wireshark path works with it present. Both matter,
    # because either can break without the other noticing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tshark
        # tshark only, not the `wireshark` metapackage, which would pull in
        # Qt and the whole desktop stack for no benefit: the GUI-pivot
        # tests only build and print commands, they never launch anything.
        # DEBIAN_FRONTEND stops the wireshark-common postinst prompting
        # about who may capture packets, which would hang the runner.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - name: Install package with test-relevant extras
        run: pip install -e ".[dev,pcap,intel,evtx,web]"

      - name: Confirm the Wireshark path is actually being exercised
        # Without this, a discovery regression would quietly send every
        # Wireshark test back to skipping and this job would still pass -
        # which is the exact failure mode the job was added to prevent.
        run: |
          python -c "
          from netforensicai.integrations import wireshark
          assert wireshark.available(), 'tshark is installed but was not discovered'
          print('tshark discovered:', wireshark.version(), wireshark.tshark_path())
          "

      - name: Run tests
        run: pytest -q

  build-check:
    # Separate from the test matrix: this only needs to run once and
    # exists to catch packaging regressions (e.g. a new static/data file
    # added without updating [tool.setuptools.package-data]) that the
    # editable install the test job uses would never surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Confirm the web UI's static assets are bundled
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install --quiet dist/*.whl
          /tmp/install-check/bin/python -c "
          import netforensicai.web as w, pathlib, sys
          index = pathlib.Path(w.__file__).parent / 'static' / 'index.html'
          if not index.exists():
              sys.exit(f'missing bundled static asset: {index}')
          print(f'found {index}')
          "
