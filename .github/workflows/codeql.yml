name: CodeQL

# Static analysis (SAST) for the Python and JavaScript in this repo. Runs on
# pushes and PRs to catch a regression before it merges, plus a weekly
# scheduled scan so a newly published CodeQL query still finds an issue in
# code that hasn't changed since it was written. Results land in the
# repository's Security -> Code scanning tab.
#
# `python` covers netforensicai/ (the CLI, core, parsers, web backend);
# `javascript-typescript` covers netforensicai/web/static/app.js (the frontend
# that renders untrusted evidence into the DOM). Both matter here: the Python
# side ingests hostile files, the JS side displays their contents.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Mondays at 07:00 UTC. Weekly is enough for a project this size and keeps
    # the security tab current without spending CI minutes on every idle day.
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL to upload its findings to the Security tab.
      security-events: write
      # Needed by the action to read the workflow/actions context.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-and-quality` is a broader query suite than the default -
          # for a security tool the extra quality queries (e.g. unsafe
          # deserialization, path handling) are worth the slightly longer run.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          category: "/language:${{ matrix.language }}"
